[package]
name = "skillharbor"
version = "1.36.1"
description = "SkillHarbor - Chinese-first personal skill library for AI agents"
authors = ["tianliang"]
license = "MIT"
edition = "2021"
rust-version = "1.88"
default-run = "skillharbor"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "2.9.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2.5.5"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-updater = "2.11.0"
tauri-plugin-single-instance = "2.4.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.0", features = ["v4", "v7"] }
sha2 = "0.11.0"
dirs = "6.0.0"
walkdir = "2.5.0"
fs2 = "0.4.3"
unicode-normalization = "0.1.25"
caseless = "0.2.2"
reqwest = { version = "0.13.4", features = ["blocking", "json", "form"] }
anyhow = "1.0.104"
chrono = "0.4.45"
gethostname = "1.1.0"
serde_yaml_ng = "0.10.0"
git2 = { version = "0.21", features = ["vendored-openssl"] }
tokio = { version = "1.53.1", features = ["full"] }
regex = "1.13.1"
hex = "0.4.3"
urlencoding = "2.1.3"
zip = "8.6.0"
tempfile = "3.27.0"
aes-gcm = "0.11.1"
keyring = "4.2.0"
rand = "0.10.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.0"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
keyring-core = "1.0"

[target.'cfg(windows)'.dependencies]
junction = "2.0.0"
